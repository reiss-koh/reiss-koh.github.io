# The site moved to GitHub Pages; the old Netlify site keeps serving its last (Hugo Blox) deploy.
# "ignore" makes Netlify skip the builds that pushes start. A build that skips that check (for example
# one started by a build hook) runs "command", which fails on purpose, so nothing new is ever published.
# Once the Netlify site is deleted, this file is unnecessary and can be removed.
[build]
  ignore = "exit 0"
  command = "echo 'This site moved to GitHub Pages; Netlify keeps serving its last deploy.' && exit 1"
