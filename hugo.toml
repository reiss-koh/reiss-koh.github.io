# Site settings. Content lives in data/*.yaml and content/_index.md — see README.md.
# baseURL is replaced automatically by the GitHub Pages deploy workflow.
baseURL = "https://reiss-koh.github.io/"
locale = "en-us"
title = "Reiss Koh"
disableKinds = ["taxonomy", "term", "section", "rss"]
enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true
# ==text== in Markdown highlights it (used for the topics in the About text)
[markup.goldmark.extensions.extras.mark]
  enable = true

[params]
  # How many news items to show before the "older news" toggle.
  newsVisible = 8
  # Emoji at the end of news items: true shows them, false hides them.
  newsEmoji = false
  # Google Search Console ownership check (the content="…" code it gives you)
  googleSiteVerification = "loduRBHCL93eVhS0WH7kEMDTn1sh6AocuGZU9a5E9f0"
