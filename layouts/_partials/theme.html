{{- /* Light/dark toggle. The site starts in light mode; a visitor's choice is
       remembered in their browser (localStorage), and head.html applies a
       saved dark choice before the page is drawn. The button stays hidden
       when JavaScript is off. */ -}}
<button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false" hidden>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5a8.5 8.5 0 1 0 10.6 10.6z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
</button>
<script>
(function () {
  var root = document.documentElement;
  var button = document.querySelector(".theme-toggle");
  function isDark() { return root.getAttribute("data-theme") === "dark"; }
  function update() {
    var dark = isDark();
    button.setAttribute("aria-pressed", dark ? "true" : "false");
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
      m.setAttribute("content", dark ? "#111111" : "#ffffff");
    });
  }
  button.addEventListener("click", function () {
    var theme = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
    update();
  });
  button.hidden = false;
  update();
})();
</script>
